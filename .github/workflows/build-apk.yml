name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        run: npm install --legacy-peer-deps
      - name: Prepare web files
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi
          ls -la www
      - name: Create Android project
        run: npx cap add android
      - name: Add mic permission
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO" /><queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries></manifest>#' $M
          grep -c RECORD_AUDIO $M
      - name: Sync
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HisaabKitaab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
